<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 02 - Taylor Swift Album & Color Mixer</title>
  <link rel="stylesheet" href="css/stylesheet.css">
</head>
<body>

  <main class="card" id="album-card">
    <h1 id="album-title">Taylor Swift Era Mixer</h1>
    <p class="lyric" id="album-lyric">Pick an album or play with the colors below!</p>

    <div class="song-badge">
      <span>Favorite Track: </span>
      <strong id="song-display">All Too Well</strong>
    </div>

    <hr>

    <!-- UI Element 1: <select> menu with all 11 albums -->
    <div class="control-group">
      <label for="album-select">1. Choose an Album (Changes theme & lyric):</label>
      <select id="album-select">
        <option value="default">-- Select an Album --</option>
        <option value="debut">Taylor Swift (Debut)</option>
        <option value="fearless">Fearless (Taylor's Version)</option>
        <option value="speaknow">Speak Now (Taylor's Version)</option>
        <option value="red">Red (Taylor's Version)</option>
        <option value="1989">1989 (Taylor's Version)</option>
        <option value="reputation">reputation</option>
        <option value="lover">Lover</option>
        <option value="folklore">folklore</option>
        <option value="evermore">evermore</option>
        <option value="midnights">Midnights</option>
        <option value="ttpd">The Tortured Poets Department</option>
      </select>
    </div>

    <!-- UI Element 2: <input type="text"> box -->
    <div class="control-group">
      <label for="song-input">2. Type Your Favorite Song:</label>
      <input type="text" id="song-input" placeholder="Type a song title here...">
    </div>

    <!-- UI Element 3: <input type="color"> picker -->
    <div class="control-group">
      <label for="color-picker">3. Pick Any Custom Background Color:</label>
      <input type="color" id="color-picker" value="#f4f1ea">
    </div>

    <!-- UI Element 4: <button> element -->
    <div class="control-group">
      <label>4. Surprise Color Mixer:</label>
      <button type="button" id="random-btn">Shuffle Random Colors</button>
    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
